name: Pull Request Quality Assurance & Test Coverage

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality-check:
    name: Build, Coverage (>=90%), Typecheck, Lint & Database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: "Step 1: Production Build Verification (Checked First)"
        run: npm run build

      - name: "Step 2: Unit Tests with 90% Code Coverage (Checked First)"
        run: npm run test:coverage -- --json --outputFile=coverage/test-results.json

      - name: "Step 3: TypeScript Type Checking"
        run: npm run typecheck

      - name: "Step 4: ESLint Code Quality"
        run: npm run lint

      - name: "Step 5: Prisma Database Schema Validation"
        run: npm run db:validate

      - name: Generate PR Quality Summary Report
        if: always()
        run: node scripts/generate-pr-summary.js

      - name: Publish or Update PR Summary Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const summaryPath = path.join(process.env.GITHUB_WORKSPACE, 'coverage', 'pr-summary.md');
            if (!fs.existsSync(summaryPath)) {
              console.log('No pr-summary.md found, skipping PR comment.');
              return;
            }
            
            const body = fs.readFileSync(summaryPath, 'utf8');
            const tag = '<!-- procpx-ci-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            
            // Search for existing report comment
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            
            const existingComment = comments.data.find(c => c.body && c.body.includes(tag));
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              console.log(`Updated existing PR comment #${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              console.log(`Created new PR comment on #${issue_number}`);
            }
